name: Build and Release Job Express Attendance APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew || true

      - name: Build Debug & Release APK
        run: |
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Job-Express-Attendance-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          name: "Job Express Attendance v1.0.0"
          tag_name: "v1.0.0-${{ github.run_number }}"
          body: |
            ## Job Express Attendance - Official Release 📱
            - ✅ সম্পূর্ণ বিনামূল্যে ব্যবহারযোগ্য লাইব্রেরি ও কোচিং উপস্থিতি সিস্টেম।
            - 🔍 QR কোড স্ক্যানার ও ডুপ্লিকেট উপস্থিতি প্রতিরোধ ব্যবস্থা।
            - 📊 গুগল শিটস (Google Sheets) অটোমেশন ও টিচার ড্যাশবোর্ড।
            - 👨‍💻 Developer: Nahid Hasan (University of Barishal).
            
            **ডাউনলোড নির্দেশ:** নিচে প্রদর্শিত `Job-Express-Attendance.apk` ফাইলে ক্লিক করে আপনার ফোনে সরাসরি ইন্সটল করুন।
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
