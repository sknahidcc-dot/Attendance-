name: Build and Release Job Express Attendance APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew || true

      - name: Generate Signing Keystores
        run: |
          # Generate debug.keystore if not present
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          # Generate release keystore if not present
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Job Express,O=Job Express,C=BD"
          fi

      - name: Build Debug & Release APK
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace || gradle assembleDebug assembleRelease --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p release-apks
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-apks/Job-Express-Attendance-Release.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-apks/Job-Express-Attendance-Debug.apk
          fi
          ls -la release-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Job-Express-Attendance-APKs
          path: release-apks/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          name: "Job Express Attendance v1.0.0"
          tag_name: "v1.0.0-${{ github.run_number }}"
          body: |
            ## Job Express Attendance - Official Release 📱
            - ✅ সম্পূর্ণ বিনামূল্যে ব্যবহারযোগ্য লাইব্রেরি ও কোচিং ডিজিটাল উপস্থিতি ব্যবস্থাপনা।
            - 🔍 QR কোড স্ক্যানার ও ডুপ্লিকেট উপস্থিতি প্রতিরোধ ব্যবস্থা।
            - 📊 গুগল শিটস (Google Sheets) অটোমেশন ও টিচার ড্যাশবোর্ড।
            - 👨‍💻 Developer: Nahid Hasan (University of Barishal).
            
            **ডাউনলোড নির্দেশ:**
            নিচে দেওয়া `Job-Express-Attendance-Release.apk` ফাইলটি সরাসরি আপনার ফোনে ডাউনলোড করে ইন্সটল করুন। কোনো কম্পিউটার প্রয়োজন নেই!
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
